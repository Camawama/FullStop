plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Bundle library dependencies (MixinExtras) inside the release jar.
jarJar.enable()

// THE GAME TESTS ARE OPT-IN: gradlew runGameTestServer -PshipTests
// They live in src/gametest (ship collision rules against Valkyrien Skies' real block masses,
// and real VS ships crashed into terrain) and are compiled into the mod only with the flag, so
// the release jar never carries them. The ship tests assemble ships with VS's own ShipAssembler,
// the one place FullStop names VS types, so the flag also puts VS on the compile classpath.
if (project.hasProperty('shipTests')) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}

// Which Valkyrien Skies physics backend the ship tests run on: -PvsBackend=classic|physx|jolt
// (default physx). VS 2.4.11 fires collision events only on PhysX and Jolt; on classic (VS's
// default) Camafy's collision fallback reports the crashes instead, and the tests check that
// Camafy picked the right source. -PcollisionFallback=auto|off|force|shadow is handed to Camafy
// as -Dcamafy.collisionFallback (shadow: VS's events are used, and the fallback logs what it would
// have reported for the same crashes). -PhideBackend makes Camafy treat the backend as unknown
// (-Dcamafy.vsPhysicsBackend=unknown): the fallback runs until VS's first collision event.
def shipTestBackend = {
    def backend = (project.findProperty('vsBackend') ?: 'physx').toString().toLowerCase(Locale.ROOT)
    if (!(backend in ['classic', 'physx', 'jolt'])) {
        throw new GradleException("-PvsBackend must be classic, physx or jolt, not '${backend}'")
    }
    return backend
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            // Its own directory and world (see cleanGameTestWorld below), so test runs never
            // rotate the dev client's logs or touch its saves.
            workingDirectory project.file('run-gametest')
            if (project.hasProperty('shipTests')) {
                // Camafy logs every ship collision it publishes: the contact frames the tests check.
                property 'camafy.debugCollisions', 'true'
                // The tests expect Camafy's collision source to follow the backend (see above).
                property 'fullstop.test.vsBackend', shipTestBackend()
                if (project.hasProperty('collisionFallback')) {
                    property 'camafy.collisionFallback', project.property('collisionFallback').toString()
                }
                if (project.hasProperty('hideBackend')) {
                    property 'camafy.vsPhysicsBackend', 'unknown'
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    // Camafy (net.camacraft.camafy:camafy): publishToMavenLocal from the Camafy project.
    mavenLocal {
        content { includeGroup 'net.camacraft.camafy' }
    }

    // Parchment mapping data: mirror first, canonical host as fallback (see settings.gradle).
    maven { url = 'https://ldtteam.jfrog.io/artifactory/parchmentmc-public/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }

    // Valkyrien Skies & KotlinForForge
    maven {
        url = 'https://maven.valkyrienskies.org'
        // The VS maven serves Kotlin for Forge's metadata but not its jar;
        // resolving it there fails the build ("Could not find kotlinforforge").
        content { excludeGroup 'thedarkcolour' }
    }
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }

    // CurseMaven + Modrinth Maven for runtime test mods
    maven { url = "https://cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" }

    flatDir { dir 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin annotation processor
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Camafy: the shared library FullStop builds on (weight model, ship and gravity
    // compat, audio effects). A required mod at runtime (see mods.toml).
    implementation fg.deobf("net.camacraft.camafy:camafy:${camafy_version}")

    // Mixin Extras
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation fg.deobf("io.github.llamalad7:mixinextras-forge:0.4.1")
    // Ship MixinExtras inside the jar: @WrapOperation mixins (ElytraDamageCanceler,
    // KeyboardHandlerMixin) fail at mixin-apply in any pack that doesn't already
    // provide it via another mod.
    jarJar("io.github.llamalad7:mixinextras-forge:0.4.1") {
        jarJar.ranged(it, "[0.4.1,)")
    }

    // -------------------------
    // Optional Valkyrien Skies integration
    // -------------------------
    // No compile dependency: FullStop reaches ships only through Camafy's ship
    // utilities, which name no VS types.

    // Dev runtime: include VS in your run configs so you can test locally.
    // Camafy refuses VS older than 2.4.11.
    runtimeOnly fg.deobf("org.valkyrienskies:valkyrienskies-120-forge:2.4.11")
    if (project.hasProperty('shipTests')) {
        // Only the opt-in ship tests (src/gametest) compile against VS: they assemble real ships.
        compileOnly fg.deobf("org.valkyrienskies:valkyrienskies-120-forge:2.4.11")
        compileOnly "org.valkyrienskies.core:api:1.1.0+cf208d8b56"
    }

    // Only keep KotlinForForge if YOU need it (your mod is Kotlin) or some runtime dev setup needs it.
    // If you don't use Kotlin at all, you can remove this.
    runtimeOnly fg.deobf("thedarkcolour:kotlinforforge:4.11.0")

    // -------------------------
    // Other Mods (compat testing only)
    // -------------------------

    runtimeOnly fg.deobf("curse.maven:grappling-hook-mod-reforged-1166811:7087090")
    runtimeOnly fg.deobf("curse.maven:wall-jump-txf-909143:6584381")
    runtimeOnly fg.deobf("curse.maven:spark-361579:4738952")
    // Client-side mods: the game test server (-PshipTests) is a DEDICATED server, and Cubes
    // Without Borders refuses to load there ("invalid dist DEDICATED_SERVER"), so these stay off
    // that run.
    if (!project.hasProperty('shipTests')) {
        runtimeOnly fg.deobf("curse.maven:nbt-autocomplete-813557:5957924")
        runtimeOnly fg.deobf("curse.maven:do-a-barrel-roll-663658:5326142")
        runtimeOnly fg.deobf("curse.maven:embeddium-908741:5681725")
        runtimeOnly fg.deobf("curse.maven:wakes-reforged-1223529:7494279")
        runtimeOnly fg.deobf("curse.maven:damagenumbers-1022853:5475417")
        runtimeOnly fg.deobf("curse.maven:cubes-without-borders-975120:5855464")
    }

    //runtimeOnly fg.deobf("curse.maven:gravityvs-1410068:7363495")
    //runtimeOnly fg.deobf("curse.maven:particular-reforged-1219053:6916904")
    //runtimeOnly fg.deobf("curse.maven:immersive-optimization-1163206:6969713")
    //runtimeOnly fg.deobf("curse.maven:customnpcs-unofficial-1052708:7188795") for testing entity rotation bug
    //runtimeOnly fg.deobf("curse.maven:combat-roll-678036:5625925") crashes
}

mixin {
    add sourceSets.main, 'mixins.fullstop.refmap.json'
    config 'mixins.fullstop.common.json'
    config 'mixins.fullstop.client.json'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range, camafy_version_range: camafy_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

// The jarJar task output (build/libs/<name>-<version>-all.jar) is the RELEASE
// artifact — it contains the reobfuscated mod plus the bundled MixinExtras.
tasks.named('jarJar').configure {
    finalizedBy 'reobfJarJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// A game test run starts from an empty, flat world: tests build (and crash ships into) terrain
// that must not be there the next time, and generated terrain would intrude on the test plots.
tasks.register('cleanGameTestWorld', Delete) {
    group = 'verification'
    description = 'Deletes the saved game test world so each run starts clean.'
    delete file('run-gametest/world')
}

tasks.register('gameTestServerProperties') {
    group = 'verification'
    description = 'Forces the game test world to be flat, fixed-seed and empty.'
    doLast {
        def props = new Properties()
        def target = file('run-gametest/server.properties')
        target.parentFile.mkdirs()
        if (target.exists()) target.withInputStream { props.load(it) }
        props.setProperty('level-type', 'minecraft:flat')
        props.setProperty('level-seed', '0')
        props.setProperty('generate-structures', 'false')
        props.setProperty('spawn-monsters', 'false')
        props.setProperty('spawn-animals', 'false')
        props.setProperty('spawn-npcs', 'false')
        target.withOutputStream { props.store(it, 'Written by gameTestServerProperties - see build.gradle') }

        if (project.hasProperty('shipTests')) {
            // Each fresh test world starts on the backend -PvsBackend picked (PhysX unless told
            // otherwise). Valkyrien Skies 2.4.11 only fires collision events on PhysX and Jolt;
            // on KRUNCH_CLASSIC, its default, Camafy's fallback reports the crashes.
            def backend = [classic: 'KRUNCH_CLASSIC', physx: 'KRUNCH_PHYSX', jolt: 'KRUNCH_JOLT'][shipTestBackend()]
            def vsCore = file('run-gametest/defaultconfigs/valkyrienskies/vs-core-server.toml')
            vsCore.parentFile.mkdirs()
            vsCore.text = "[\"Krunch Konfig\"]\n    physicsBackend = \"${backend}\"\n"
            println "Ship tests on Valkyrien Skies' ${backend} backend"
        }
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'cleanGameTestWorld'
    dependsOn 'gameTestServerProperties'
}