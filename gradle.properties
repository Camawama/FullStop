# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx6G

# Recommended for local dev speed. If you prefer it off, set to false.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Environment Properties

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)

forge_version=47.4.16
# 47.4 is the first Forge build Camafy runs on.
forge_version_range=[47.4,)
loader_version_range=[47,)

mapping_channel=parchment
mapping_version=2023.09.03-1.20.1

## Dependencies

# Camafy, the shared library: weight model, Valkyrien Skies and gravity compat, audio effects.
camafy_version=0.1.50
camafy_version_range=[0.1.50,0.2)

## Mod Properties

mod_id=fullstop
mod_name=Full Stop!
mod_license=GPLv3
mod_version=2.0.0
mod_group_id=net.camacraft.fullstop
mod_authors=cama,joe_devel
mod_description=Speed thrills, but it hurts. Expect the unexpected!
