modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Camawama/FullStop/issues"

[[mods]]
modId="fullstop"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Camawama/FullStop"
logoFile="fullstop.png"
credits="Special thanks go to kawaiicakes for creating the original mod, Velocity Based Damage Deluxe, as well as to all the talented artists who contribute."
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.fullstop]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.fullstop]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Camafy, the shared library: the weight model, Valkyrien Skies and gravity
# mod compat, and the audio muffle all come from it.
[[dependencies.fullstop]]
modId="camafy"
mandatory=true
versionRange="${camafy_version_range}"
ordering="AFTER"
side="BOTH"

# Soft dependency: FullStop ships ship-motion compensation and ship-block impact
# support that only activates when Valkyrien Skies is present.
[[dependencies.fullstop]]
modId="valkyrienskies"
mandatory=false
versionRange="[2.4,)"
ordering="AFTER"
side="BOTH"

# Soft dependency: with Gravity Unbound present, impacts are measured in each
# entity's gravity frame (falls along a field's pull count as falls, whichever
# world axis they happen along) and velocity is exchanged in world space.
[[dependencies.fullstop]]
modId="gravityunbound"
mandatory=false
versionRange="[1.0,)"
ordering="AFTER"
side="BOTH"

# Soft dependency: "Create Catastrophes" (compat/create, config [create]): every moving part of
# Create is dangerous - contraptions strike what they run into like ships do, spinning gears and
# water wheels pull bodies in. Idle without Create.
[[dependencies.fullstop]]
modId="create"
mandatory=false
versionRange="[6.0,)"
ordering="AFTER"
side="BOTH"
